<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/SolarIQ/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Solar IQ">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Theme color for mobile browser status bar -->
  <meta name="theme-color" content="#0A0E27" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F5F5FA" media="(prefers-color-scheme: light)">

  <!-- Browser / PWA status bar color — matches the app's dark scaffold so
       the iOS Safari status bar blends with the AppBar instead of showing
       a white background with black icons. -->
  <meta name="theme-color" content="#0A0E27">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SolarIQ">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SolarIQ</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    Pre-register the FCM service worker BEFORE Flutter starts.
    firebase_messaging.getToken() on web requires the service worker
    to be registered and active — without this, Firebase silently fails
    to generate a push token on web/PWA.
  -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker
        .register('/firebase-messaging-sw.js', { scope: '/' })
        .then(function (reg) {
          console.log('[SolarIQ] FCM SW registered, scope:', reg.scope, 'state:', reg.active ? reg.active.state : 'installing');
        })
        .catch(function (err) {
          console.error('[SolarIQ] FCM SW registration failed:', err);
        });
    }
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
